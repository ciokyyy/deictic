<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b96"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#0d0d10"/>

  <!-- title -->
  <text x="28" y="42" fill="#fafafa" font-size="19" font-weight="600">deictic — one hop from a spot in the page to a session that can change it</text>
  <text x="28" y="64" fill="#8b8b96" font-size="13">hold alt, click the thing you mean, write what is wrong with it</text>

  <!-- 1. browser -->
  <rect x="28" y="96" width="196" height="150" rx="10" fill="#16161b" stroke="#2a2a33"/>
  <text x="44" y="120" fill="#fafafa" font-size="13" font-weight="600">browser</text>
  <text x="44" y="142" fill="#8b8b96" font-size="11.5">the running Vite app</text>
  <rect x="44" y="156" width="164" height="30" rx="6" fill="#1d1d24" stroke="#33333f"/>
  <text x="54" y="175" fill="#c9c9d1" font-size="11">client.mjs overlay</text>
  <text x="44" y="206" fill="#8b8b96" font-size="11.5">alt + click → chip</text>
  <text x="44" y="224" fill="#8b8b96" font-size="11.5">top layer, draggable, deaf</text>

  <!-- 2. vite -->
  <rect x="272" y="96" width="196" height="150" rx="10" fill="#16161b" stroke="#2a2a33"/>
  <text x="288" y="120" fill="#fafafa" font-size="13" font-weight="600">vite dev server</text>
  <text x="288" y="142" fill="#8b8b96" font-size="11.5">the plugin, in the middle</text>
  <rect x="288" y="156" width="164" height="30" rx="6" fill="#1d1d24" stroke="#33333f"/>
  <text x="298" y="175" fill="#c9c9d1" font-size="11">index.mjs</text>
  <text x="288" y="206" fill="#8b8b96" font-size="11.5">resolves file:line</text>
  <text x="288" y="224" fill="#8b8b96" font-size="11.5">reads the source around it</text>

  <!-- 3. note -->
  <rect x="516" y="96" width="336" height="150" rx="10" fill="#16161b" stroke="#2a2a33"/>
  <text x="532" y="120" fill="#fafafa" font-size="13" font-weight="600">one message</text>
  <text x="532" y="142" fill="#8b8b96" font-size="11.5">TOON — a table, then notes, then code</text>
  <rect x="532" y="156" width="304" height="74" rx="6" fill="#0a0a0d" stroke="#26262f"/>
  <text x="542" y="174" fill="#7dd3a0" font-size="10.5" font-family="ui-monospace, monospace">feedback[2]{index,file,line,url}</text>
  <text x="542" y="190" fill="#7dd3a0" font-size="10.5" font-family="ui-monospace, monospace">notes:</text>
<text x="542" y="206" fill="#c9c9d1" font-size="10.5" font-family="ui-monospace, monospace">  1: "this should be the accent"</text>
  <text x="542" y="222" fill="#c9c9d1" font-size="10.5" font-family="ui-monospace, monospace">sources: file:line → excerpt</text>

  <!-- arrows across the top row -->
  <line x1="224" y1="171" x2="266" y2="171" stroke="#8b8b96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="171" x2="510" y2="171" stroke="#8b8b96" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- labels on arrows -->
  <text x="245" y="162" fill="#6f6f7a" font-size="10" text-anchor="middle">POST</text>
  <text x="489" y="162" fill="#6f6f7a" font-size="10" text-anchor="middle">compose</text>

  <!-- 4. bridge -->
  <rect x="272" y="296" width="196" height="106" rx="10" fill="#16161b" stroke="#2a2a33"/>
  <text x="288" y="320" fill="#fafafa" font-size="13" font-weight="600">bridge.mjs</text>
  <text x="288" y="340" fill="#8b8b96" font-size="11.5">127.0.0.1 only</text>
  <text x="288" y="360" fill="#8b8b96" font-size="11.5">argv, never a shell</text>
  <text x="288" y="380" fill="#8b8b96" font-size="11.5">does not validate a pane</text>

  <!-- 5. herdr -->
  <rect x="516" y="296" width="336" height="106" rx="10" fill="#16161b" stroke="#2a2a33"/>
  <text x="532" y="320" fill="#fafafa" font-size="13" font-weight="600">herdr agent pane</text>
  <text x="532" y="340" fill="#8b8b96" font-size="11.5">the session that already owns the code</text>
  <text x="532" y="360" fill="#8b8b96" font-size="11.5">picked by the person, or started from the 22 kinds</text>
  <text x="532" y="380" fill="#8b8b96" font-size="11.5">herdr is the authority on whether a pane exists</text>

  <!-- down arrows -->
  <line x1="684" y1="246" x2="684" y2="290" stroke="#8b8b96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="274" fill="#6f6f7a" font-size="10">text/plain</text>
  <line x1="468" y1="349" x2="510" y2="349" stroke="#8b8b96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="489" y="340" fill="#6f6f7a" font-size="10" text-anchor="middle">spawn</text>

  <!-- footnote -->
  <text x="28" y="278" fill="#6f6f7a" font-size="11">the endpoint is one string; the plugin derives the bridge base from it</text>
  <text x="28" y="422" fill="#4f4f58" font-size="10">the bridge is the only part that knows herdr exists — swap it and the plugin still works</text>
</svg>
